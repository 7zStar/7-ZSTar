name: release

# Tag-driven release. Produces, for every architecture, a per-machine .msi, a
# per-user -user.msi and a .zip, plus SHA256SUMS and a source tarball, and
# leaves them on a DRAFT release for a human to check before publishing.
#
# The source tarball is not optional: 7-ZSTar is LGPL v3, and section 4(d)
# requires the corresponding source to accompany the binaries.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (workflow_dispatch only)'
        required: true

# Read-only by default. Only the release job, which creates the draft, gets
# write access - the build job runs the whole fork's build scripts and has no
# business holding a token that can push.
permissions:
  contents: read

env:
  # Resolved once here rather than with a shell fallback. GITHUB_REF_NAME is
  # always set - on workflow_dispatch it is the branch the run was launched
  # from (usually main), never empty - so "${GITHUB_REF_NAME:-<input>}" would
  # silently ignore the tag input and build the wrong ref.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120  # see build.yml
    strategy:
      fail-fast: true
      matrix:
        platform: [x64, x86, arm64]
    # Actions are pinned to a commit; see build.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: build\Build.ps1 -Platform ${{ matrix.platform }}

      # x86 runs under WOW64 on the x64 runner; only arm64 cannot execute here.
      - name: Smoke tests
        if: matrix.platform != 'arm64'
        shell: pwsh
        run: build\Test-Smoke.ps1 -Platform ${{ matrix.platform }}

      # The two extensions must be added explicitly; see build.yml.
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe'
          & $wix extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wix extension add -g WixToolset.Util.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signing: nothing in the release is signed by a certificate authority,
      # and no signing key is stored in GitHub. The one thing that is signed is
      # the sparse MSIX inside the per-machine MSI (the Windows 11 first-level
      # context menu): -CreateSigningCert makes a throwaway self-signed
      # certificate for CN=7-ZSTar project in this job's Cert:\CurrentUser\My,
      # signs the MSIX with it and ships only its public half inside the MSI.
      # The private key dies with the runner. A different certificate for every
      # package (each architecture is its own job) is harmless: uninstalling removes every TrustedPeople
      # certificate with that subject, and an upgrade removes the old version
      # first. Consequence: the same tag built on another machine has other
      # hashes, so SHA256SUMS is only valid for what this workflow uploaded.
      # makeappx and signtool come from the Windows SDKs on the image
      # (10.0.17763 to 10.0.26100 on windows-2022); Build-Package.ps1 throws if
      # it cannot find them, so a missing SDK fails this step.
      - name: Package
        shell: pwsh
        run: installer\Build-Package.ps1 -Platform ${{ matrix.platform }} -CreateSigningCert

      # No certificate: the per-user package carries no sparse package.
      - name: Package (per-user msi)
        shell: pwsh
        run: installer\Build-Package.ps1 -Platform ${{ matrix.platform }} -PerUser

      # -RequireSparse fails the job if the per-machine MSI came out without
      # its sparse package, which Build-Package.ps1 would only warn about.
      - name: Check the packages' registry tables
        shell: pwsh
        run: installer\Test-MsiRegistry.ps1 -RequireSparse

      # Only a hand-off to the release job below; the published copies live
      # on the release itself. A week rather than a day, so a release job
      # that failed can still be re-run on its own the next day. Only the
      # packages: installer\dist also holds the .wixpdb build databases, which
      # are neither shipped nor checksummed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.platform }}
          path: |
            installer/dist/*.msi
            installer/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    # Pinned rather than ubuntu-latest, which moves to a new release every two
    # years (24.04 -> 26.04 is rolling out from 2026-10-19).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # Upgraded together with upload-artifact: v8 is the release that pairs
      # with upload-artifact v7, and fails on a digest mismatch by default.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true

      # Exactly three files per architecture - the per-machine .msi, the
      # per-user -user.msi and the .zip - and nothing else, so a missing
      # package or a stray build file cannot reach the release or SHA256SUMS.
      # Runs before the source tarball is added to the directory.
      - name: Check the package set
        working-directory: artifacts
        run: |
          fail=0
          for arch in x64 x86 arm64; do
            for suffix in "${arch}.msi" "${arch}-user.msi" "${arch}.zip"; do
              n=$(ls -1 ./*-"${suffix}" 2>/dev/null | wc -l)
              if [ "$n" -ne 1 ]; then
                echo "::error::expected exactly one *-${suffix}, found ${n}"
                fail=1
              fi
            done
          done
          total=$(ls -1 | wc -l)
          if [ "$total" -ne 9 ]; then
            echo "::error::expected 9 files, found ${total}"
            fail=1
          fi
          ls -l
          exit $fail

      # LGPL v3 section 4(d): the corresponding source must accompany the
      # binaries. Archived from the tag itself so it matches what shipped.
      - name: Source tarball
        run: |
          git archive --format=tar.gz --prefix="7-ZSTar-${RELEASE_TAG}/" \
            -o "artifacts/7-ZSTar-${RELEASE_TAG}-source.tar.gz" "$RELEASE_TAG"

      - name: SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # tag_name is explicit because on workflow_dispatch github.ref is the
      # branch the run was launched from, and with draft: true the action
      # skips its own "this needs a tag" check.
      - name: Draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Verifying

            Compare your download against `SHA256SUMS`. These artifacts are
            **not code-signed**, so Windows SmartScreen will warn on first run.
            The only signature is on the Windows 11 context-menu package
            inside the per-machine `.msi`: a self-signed certificate generated
            while building that one package (each architecture has its own),
            whose public half the installer adds to the machine's Trusted
            People store and the uninstaller removes again.
            It is not a certificate-authority signature and says nothing about
            who built the package.

            ## Packages

            `.msi` installs per-machine and registers the Explorer context
            menu; `-user.msi` installs for the current account only, needs no
            administrator, and has the context menu without the Windows 11
            first-level entry; `.zip` is portable, needs no administrator, and
            registers nothing. Install one of the two `.msi` per machine, not
            both, and pick the architecture of Windows itself (x86 on 32-bit
            Windows, x64 on 64-bit, arm64 on Windows on Arm): the x86 shell
            extension is 32-bit and 64-bit Explorer cannot load it. All
            of them install alongside official 7-Zip without disturbing it.

            `*-source.tar.gz` is the corresponding source for these binaries,
            included to satisfy LGPL v3 section 4(d).
